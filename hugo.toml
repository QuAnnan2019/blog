baseURL = "https://quannan2019.github.io/blog/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "安南的博客"
theme = "LoveIt"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[[menu.main]]
  identifier = "posts"
  name = "博客"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "notes"
  name = "笔记"
  url = "/notes/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于我"
  url = "/about/"
  weight = 40

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "安南的博客"
  description = "记录技术、思考与知识。"

  [params.author]
    name = "安南"
    email = ""
    link = ""

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "📚"
      typeit = false

  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = "images/avatar.png"
      title = "安南的博客"
      subtitle = "先相信，再看见。"
      typeit = false
      social = false
    [params.home.posts]
      enable = true
      paginate = 6

  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    maxResultLength = 10
    snippetLength = 30

  [params.page]
    linkToMarkdown = true
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
