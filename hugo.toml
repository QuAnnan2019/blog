baseURL = "https://quannan2019.github.io/blog/"
locale = "en"
defaultContentLanguage = "en"
title = "My Knowledge Garden"
theme = "LoveIt"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "notes"
  name = "Notes"
  url = "/notes/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  title = "My Knowledge Garden"
  description = "A personal collection of essays and notes."

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "My Knowledge Garden"
      typeit = false

  [params.home]
    [params.home.profile]
      enable = true
      title = "My Knowledge Garden"
      subtitle = "Essays, notes, and things worth keeping."
      typeit = false
      social = false
    [params.home.posts]
      enable = true
      paginate = 6

  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    maxResultLength = 10
    snippetLength = 30

  [params.page]
    linkToMarkdown = true
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
